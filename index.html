<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music player</title>
    <link rel="stylesheet" href="./style/app.css">
</head>
<body>
    <audio src="./media/m2.mp3" id="music-au"></audio>
    <div class="back-image">
        <img id="bg-img" src="" alt="no image" class="image-filter">
    </div>
    <div class="container">
    </div>
    <div class="player">
        <div class="player__prog">
            <span class="current-time">00:00</span>
            <input type="range" class="progress" value="0" min="0" max="100" step="1">
            <span class="full-time">60:60</span>
        </div>
        <div class="player__control">
            <button class="control manfi-5">-5</button>
            <button class="control prev">prev</button>
            <button class="control play">pause</button>
            <button class="control next">next</button>
            <button class="control mosbat-5">+5</button>
        </div>
    </div>
    <script src="./script/app.js"></script>
</body>
</html>
